name: 🐼 Panda Contribution Game

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install image generator
        run: python -m pip install --upgrade pillow

      - name: Generate panda animation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: python scripts/generate_panda_contributions.py

      - name: Commit panda animation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/panda-contributions.gif
          git diff --cached --quiet || git commit -m "🐼 update panda contribution game"
          git push
